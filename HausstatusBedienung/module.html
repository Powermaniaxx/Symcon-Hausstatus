</style></head><body><main>

<div class="grid" id="cards"></div>
<div id="message" role="status" aria-live="polite"></div>
<section class="section" id="motionSection"><h2>Bewegung &ndash; letzte 24 Stunden</h2><div id="motion"></div></section>
<section class="section" id="roomsSection"><h2>R&auml;ume</h2><div id="rooms"></div></section>
<section class="section" id="weatherSection"><h2>Wetter</h2><div id="weather"></div></section>
<div id="roomDeviceSections"></div>
<div class="head"><button id="roomNavigation" type="button" hidden>Räume öffnen</button><span id="refreshStatus" class="refreshStatus" role="status" aria-live="polite"></span><button id="refresh" type="button" aria-label="Werte aktualisieren" title="Hausstatus 0.12">&#8635; Aktualisieren</button></div>
</main>
<dialog id="doorDialog" aria-labelledby="doorQuestion"><h2 id="doorQuestion">Haust&uuml;r wirklich &ouml;ffnen?</h2><p>Die Falle wird entriegelt. Eine Person vor der T&uuml;r kann eintreten.</p><div class="buttons"><button id="doorCancel" type="button">Abbrechen</button><button id="doorYes" class="confirm-open" type="button">Ja, T&uuml;r &ouml;ffnen</button></div></dialog>
<script>
let state=/*INITIAL_STATE*/null;
let doorRequest=null,doorToken=null,doorExpiryTimer=null;
let busy=false, pendingTimer=null, timeoutTimer=null, editing=false, messageTimer=null;
let refreshRequest=null,refreshTimer=null;
const openPanels=new Set();
const el=id=>document.getElementById(id);
function text(node,value){node.textContent=String(value??'Unbekannt');}
function showStatus(value,temporary=false){
 clearTimeout(messageTimer);messageTimer=null;text(el('message'),value);
 if(temporary)messageTimer=setTimeout(()=>{text(el('message'),'');messageTimer=null;},3000);
}
function card(key,icon,label,value,kind=''){
 const box=document.createElement('div');box.className='card '+kind;box.id='card-'+key;
 for(const [cls,val] of [['icon',icon],['label',label],['value',value]]){const d=document.createElement('div');d.className=cls;text(d,val);box.append(d);}
 el('cards').append(box);return box;
}
function buttons(box,command,enabled){
 const row=document.createElement('div');row.className='buttons';
 for(const [caption,value] of [['Ein',true],['Aus',false]]){
  const b=document.createElement('button');b.type='button';text(b,caption);b.disabled=!enabled||busy;
  b.addEventListener('click',()=>send(command,value));row.append(b);
 }
 box.append(row);
}
function rows(target,list){const root=typeof target==='string'?el(target):target;root.replaceChildren();for(const [name,value] of list){const row=document.createElement('div');row.className='row';for(const v of [name,value]){const span=document.createElement('span');text(span,v);row.append(span);}root.append(row);}}
function doorHistory(s){const box=document.createElement('div');box.className='doorHistory';rows(box,[['Letzte \u00d6ffnung',s.DoorOpened.text],['Letzte Schlie\u00dfung',s.DoorClosed.text]]);return box;}
function boolValue(entry,on='An',off='Aus'){return entry?.raw===null?'Unbekannt':entry?.raw===true?on:entry?.raw===false?off:'Unbekannt';}
function kind(entry){return entry?.raw===true?'on':'';}
function contactValue(entry){return entry?.raw===true||entry?.raw===1?'Offen':entry?.raw===false||entry?.raw===0?'Geschlossen':'Unbekannt';}
function sliderText(value,control,formatted=''){
 let number=Number(value);if(control.percentage)number=(number-control.min)/(control.max-control.min)*100;
 const digits=Number.isInteger(control.digits)?Math.max(0,Math.min(6,control.digits)):2;
 const numeric=number.toLocaleString('de-DE',{maximumFractionDigits:digits});
 if(typeof control.suffix==='string')return (control.prefix??'')+numeric+control.suffix;
 const unit=String(formatted).replace(/[-+]?\d+(?:[.,]\d+)?/,'').trim();return numeric+(unit?' '+unit:'');
}
function outdoorToggle(box,label,entry,command,enabled){
 const row=document.createElement('label');row.className='outdoorToggle';
 const input=document.createElement('input');input.type='checkbox';input.checked=entry.raw===true;input.disabled=!enabled||busy;
 input.addEventListener('change',()=>send(command,input.checked));
 const caption=document.createElement('span');text(caption,label+': '+boolValue(entry));row.append(input,caption);box.append(row);
}
function renderOutdoor(data){
 if(!data)return;
 const block=document.createElement('section');block.id='card-outdoor';block.className='overview-group overview-outdoor';
 const heading=document.createElement('h2');text(heading,'Markise und Dachfenster');block.append(heading);
 const inside=document.createElement('div');inside.className='outdoorDevices';
 for(const [name,title] of [['Awning','Markise'],['Roof','Dachfenster']]){
  const d=data[name];const box=document.createElement('div');box.className='outdoorDevice';const h=document.createElement('h3');text(h,title);box.append(h);
  const position=document.createElement('div');position.className='row';const label=document.createElement('span'),value=document.createElement('span');text(label,'Position');text(value,d.position.text);position.append(label,value);box.append(position);
  if(d.control&&typeof d.position.raw==='number'){
   const range=document.createElement('input');range.type='range';range.min=String(d.control.min);range.max=String(d.control.max);range.step=String(d.control.step);range.value=String(d.position.raw);range.disabled=busy;range.setAttribute('aria-label',title+' Position');
   range.addEventListener('pointerdown',()=>{editing=true;});range.addEventListener('input',()=>{editing=true;text(value,sliderText(range.value,d.control,d.position.text));});
   range.addEventListener('change',()=>{editing=false;send(name+'Position',Number(range.value));});range.addEventListener('blur',()=>{if(editing){editing=false;render();}});box.append(range);
  }else if(d.reason){const n=document.createElement('div');n.className='small';text(n,d.reason);box.append(n);}
  const status=document.createElement('div');status.className='row outdoorStatus';const statusLabel=document.createElement('span'),statusValue=document.createElement('span');text(statusLabel,'Status');text(statusValue,d.status.text);status.append(statusLabel,statusValue);box.append(status);
  outdoorToggle(box,'Automatik',d.auto,name+'Auto',d.canAuto);
  if(name==='Roof')outdoorToggle(box,'\u00dcber Nacht',d.night,'RoofNight',d.canNight);
  inside.append(box);
 }
 block.append(inside);el('cards').append(block);
}
function render(){
 updateRefreshButton();
 if(!state)return;
 el('cards').replaceChildren();
 const s=state;
 card('presence','\u{1f3e0}','Anwesenheit',boolValue(s.Presence,'Zu Hause','Abwesend'),kind(s.Presence));
 const doorOpen=s.DoorContact.raw===1||s.DoorContact.raw===true;
 const lock=s.Lock.raw;
 const lockCard=card('lock',lock===1?'\u{1f512}':'\u{1f513}','T\u00fcrschloss',lock===1?'Verriegelt':lock===2?'Aufgeschlossen':'Unbekannt',lock===1?'on':lock===2?'warn':'');
 card('contact','\u{1f6aa}','T\u00fcrkontakt',contactValue(s.DoorContact),doorOpen?'danger':contactValue(s.DoorContact)==='Geschlossen'?'on':'');
 if(s.View===2)lockCard.append(doorHistory(s));
 const permission=card('permission','\u{1f510}','T\u00fcr \u00f6ffnen',boolValue(s.DoorPermission,'Freigegeben','Gesperrt'),s.DoorPermission.raw===true?'danger':s.DoorPermission.raw===false?'on':'');
 const permissionButtons=document.createElement('div');permissionButtons.className='buttons';
 for(const [caption,value] of [['Freigeben',true],['Sperren',false]]){const b=document.createElement('button');b.type='button';text(b,caption);b.disabled=!s.Controls.DoorPermission||busy||s.DoorPermission.raw===value;b.addEventListener('click',()=>{closeDoorDialog();send('DoorPermission',value);});permissionButtons.append(b);}permission.append(permissionButtons);
 const doorButton=document.createElement('button');doorButton.type='button';text(doorButton,'T\u00fcr \u00f6ffnen');doorButton.disabled=!s.Controls.Door||busy;doorButton.style.marginTop='10px';doorButton.addEventListener('click',prepareDoor);permission.append(doorButton);
 if(!s.Controls.Door&&s.DoorReason){const n=document.createElement('div');n.className='small';text(n,s.DoorReason);permission.append(n);}

function rainPeriods(data){

 const entries=all.filter(e=>e.time>=data.start),periods=[];let active=previous,begin=active===true?data.start:null,clipped=active===true;
 for(const e of entries){
  if(e.active===active)continue;
  if(active===true&&begin!==null&&e.time>begin)periods.push({start:begin,end:e.time,clipped,ongoing:false});
  active=e.active;begin=active===true?e.time:null;clipped=false;
 }
 if(active===true&&begin!==null&&data.end>begin)periods.push({start:begin,end:data.end,clipped,ongoing:true});
 return periods;
}

  const select=document.createElement('select');select.setAttribute('aria-label',item.name);select.disabled=busy;
  let chosen=-1;
  c.options.forEach((option,index)=>{if(option.value===item.value.raw)chosen=index;});
  if(chosen<0){const n=document.createElement('option');n.value='';text(n,'Aktuell: '+item.value.text);select.append(n);}
  c.options.forEach((option,index)=>{const n=document.createElement('option');n.value=String(index);text(n,option.name);select.append(n);});select.value=chosen<0?'':String(chosen);
  select.addEventListener('change',()=>{if(select.value!==''){const index=Number(select.value);if(Number.isInteger(index)&&c.options[index])sendValue(c.options[index].value);}});box.append(select);
 }else if(c.kind==='slider'&&typeof item.value.raw==='number'){
  const range=document.createElement('input');range.type='range';range.min=String(c.min);range.max=String(c.max);range.step=String(c.step);range.value=String(item.value.raw);range.disabled=busy;range.setAttribute('aria-label',item.name);
  range.addEventListener('pointerdown',()=>{editing=true;});range.addEventListener('input',()=>{editing=true;text(valueLabel,sliderText(range.value,c,item.value.text));});range.addEventListener('change',()=>{editing=false;sendValue(Number(range.value));});range.addEventListener('blur',()=>{if(editing){editing=false;render();}});box.append(range);
 }else if(c.kind==='color'&&Number.isInteger(item.value.raw)&&item.value.raw>=0&&item.value.raw<=16777215){
  const input=document.createElement('input');input.type='color';input.value='#'+item.value.raw.toString(16).padStart(6,'0');input.disabled=busy;input.setAttribute('aria-label',item.name);
  input.addEventListener('input',()=>{editing=true;});input.addEventListener('change',()=>{editing=false;sendValue(parseInt(input.value.slice(1),16));});input.addEventListener('blur',()=>{if(editing){editing=false;render();}});box.append(input);
 }else if(c.kind==='native'){
  const b=document.createElement('button');b.type='button';text(b,'Bedienung öffnen');b.disabled=busy||typeof openObject!=='function';b.style.marginTop='8px';b.addEventListener('click',()=>{try{openObject(c.id);}catch(e){showStatus('Native Bedienung konnte nicht geöffnet werden.');}});box.append(b);
 }
}
function motionTime(t){return new Date(t*1000).toLocaleString('de-DE',{timeZone:'Europe/Berlin',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function renderMotion(m){
 el('motion').replaceChildren();if(!m)return;
 for(const sensor of m.sensors){
  const box=document.createElement('div');box.className='motionItem';
  const title=document.createElement('div');text(title,sensor.name+' \u2014 '+(sensor.current===true?'Bewegung erkannt':sensor.current===false?'Keine Bewegung':'Unbekannt'));box.append(title);
  const track=document.createElement('div');track.className='motionTrack';track.setAttribute('aria-label','Bewegungszeiten '+sensor.name);
  const h=sensor.history, entries=h.entries.filter(e=>e.time>=m.start&&e.time<=m.end).slice().sort((a,b)=>a.time-b.time);
  let active=h.previous,begin=m.start;
  const bar=(a,b)=>{if(b<=a)return;const n=document.createElement('div');n.className='motionBar';n.style.left=((a-m.start)/86400*100)+'%';n.style.width=((b-a)/86400*100)+'%';n.title=motionTime(a)+' bis '+motionTime(b);track.append(n);};
  for(const e of entries){if(active===true)bar(begin,e.time);active=e.active;begin=e.time;}if(active===true)bar(begin,m.end);
  box.append(track);const scale=document.createElement('div');scale.className='motionScale';for(const t of [m.start,m.end]){const n=document.createElement('span');text(n,motionTime(t));scale.append(n);}box.append(scale);
  if(h.note){const n=document.createElement('div');n.className='small';text(n,h.note);box.append(n);}
  const detail=document.createElement('details'),summary=document.createElement('summary');text(summary,'Zeitpunkte anzeigen ('+entries.length+' Zustandswechsel)');detail.append(summary);
  const log=document.createElement('div');log.className='motionLog';
  if(!entries.length){const n=document.createElement('div');text(n,'Keine aufgezeichneten Zustandswechsel in diesem Zeitraum.');log.append(n);}
  for(const e of entries.slice().reverse()){const n=document.createElement('div');n.className='row';text(n,motionTime(e.time)+' \u2014 '+(e.active?'Bewegung erkannt':'Keine Bewegung'));log.append(n);}detail.append(log);box.append(detail);el('motion').append(box);
 }
}
function send(command,value){
 if(busy)return;
 if(typeof requestAction!=='function'){showStatus('Die Bedienung ist nur innerhalb der Symcon-Kachel verf\u00fcgbar.');return;}
 busy=true;editing=false;showStatus('Befehl wird gesendet ...');render();
 timeoutTimer=setTimeout(()=>{busy=false;pendingTimer=null;showStatus('Keine Best\u00e4tigung empfangen. Status pr\u00fcfen.');render();},8000);
 try{requestAction(command,value);if(busy)pendingTimer=setTimeout(()=>{pendingTimer=null;try{requestAction('Refresh',true);}catch(e){showStatus('Status konnte nicht nachgeladen werden.');}},1200);}catch(e){finish();showStatus('Befehl konnte nicht gesendet werden.');render();}
}
function finish(){busy=false;clearTimeout(pendingTimer);clearTimeout(timeoutTimer);pendingTimer=null;timeoutTimer=null;updateRefreshButton();}
function updateRefreshButton(){
 const waiting=refreshRequest!==null;el('refresh').disabled=busy||waiting;
 el('refresh').setAttribute('aria-busy',String(waiting));text(el('refresh'),waiting?'Aktualisiere ...':'\u21bb Aktualisieren');
}
function finishRefresh(){clearTimeout(refreshTimer);refreshTimer=null;refreshRequest=null;updateRefreshButton();}
function requestRefresh(){
 if(busy||refreshRequest!==null)return;
 if(typeof requestAction!=='function'){text(el('refreshStatus'),'Aktualisieren ist nur in Symcon verf\u00fcgbar.');return;}
 refreshRequest='refresh-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);
 text(el('refreshStatus'),'Werte werden geladen ...');updateRefreshButton();
 refreshTimer=setTimeout(()=>{finishRefresh();text(el('refreshStatus'),'Keine Antwort. Bitte die Verbindung pr\u00fcfen.');},8000);
 try{requestAction('Refresh',refreshRequest);}catch(e){finishRefresh();text(el('refreshStatus'),'Aktualisierung konnte nicht gesendet werden.');}
}
function handleMessage(data){
 let message;try{message=typeof data==='string'?JSON.parse(data):data;}catch(e){return;}
 if(message?.error){finish();showStatus(message.error);render();return;}
 if(!message?.Controls)return;
 state=message;
 // Background updates are not an acknowledgement of the requested hardware state.
 if(!busy&&!editing)render();
}
function prepareDoor(){
 if(busy)return;
 if(typeof requestAction!=='function'){showStatus('Bedienung nur in Symcon verf\u00fcgbar.');return;}
 doorRequest=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');doorToken=null;
 send('DoorConfirm',{request:doorRequest});
}
function closeDoorDialog(){clearTimeout(doorExpiryTimer);doorToken=null;doorRequest=null;if(el('doorDialog').open)el('doorDialog').close();render();}
el('doorCancel').addEventListener('click',closeDoorDialog);
el('doorDialog').addEventListener('cancel',closeDoorDialog);
el('doorYes').addEventListener('click',()=>{if(!doorToken)return;const value={request:doorRequest,token:doorToken};closeDoorDialog();send('DoorOpen',value);});
el('refresh').addEventListener('click',requestRefresh);
// Enable acknowledgement handling separately so background messages cannot unblock a command.
const receiveState=handleMessage;
handleMessage=function(data){
 let message;try{message=typeof data==='string'?JSON.parse(data):data;}catch(e){return;}
 if(message&&Object.prototype.hasOwnProperty.call(message,'refreshDone')){
  if(message.state?.Controls){state=message.state;if(!busy&&!editing)render();}
  if(refreshRequest!==null&&message.refreshDone===refreshRequest){
   finishRefresh();
   if(message.refreshError)text(el('refreshStatus'),'Aktualisierung fehlgeschlagen: '+message.refreshError);
   else if(message.state?.Controls)text(el('refreshStatus'),'Aktualisiert um '+new Date().toLocaleTimeString('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',second:'2-digit'}));
   else text(el('refreshStatus'),'Aktualisierung hat keine g\u00fcltigen Werte geliefert.');
  }
  return;
 }
 if(message?.doorConfirmation){
  const c=message.doorConfirmation;if(c.request!==doorRequest)return;
  finish();doorToken=c.token;const remaining=(c.ttl??20)*1000;
  if(remaining<=0){closeDoorDialog();showStatus('Bestätigung abgelaufen.');render();return;}
  showStatus('');el('doorDialog').showModal();el('doorCancel').focus();
  clearTimeout(doorExpiryTimer);doorExpiryTimer=setTimeout(()=>{closeDoorDialog();showStatus('Best\u00e4tigung abgelaufen. Bitte erneut beginnen.');render();},Math.min(remaining,20000));return;
 }
 if(message?.commandDone){finish();showStatus(message.error||'Befehl \u00fcbergeben.',!message.error);if(message.state)state=message.state;render();return;}
 receiveState(data);
};
render();
</script></body></html>
