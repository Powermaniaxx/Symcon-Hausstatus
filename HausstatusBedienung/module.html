<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;color:inherit;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{padding:56px 8px 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px}.grid.single{grid-template-columns:1fr}.cinemaFields{margin-top:12px}.cinemaFields label{display:block;margin:8px 0 4px}select{width:100%;font:inherit;padding:8px;border:1px solid #8885;border-radius:8px;color:inherit;background:Canvas}.card,.section{padding:12px;border-radius:12px;border:1px solid #8883;background:#8881}.card.on{background:#2da05025}.card.warn{background:#dc961e29}.card.danger{background:#d23c3c29}.card.info{background:#3c78d229}.icon{font-size:23px;margin-bottom:6px}.label{font-size:10px;text-transform:uppercase;opacity:.65}.value{font-size:17px;font-weight:600;margin-top:4px;overflow-wrap:anywhere}.small{font-size:11px;opacity:.65;margin-top:4px}.section{margin-top:10px}.section h2{font-size:14px;margin:0 0 6px}.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #8882}.row span:first-child{opacity:.7}.row span:last-child{text-align:right;overflow-wrap:anywhere;max-width:65%}button{border:1px solid #8885;border-radius:8px;padding:8px 10px;min-height:38px;font:inherit;color:inherit;background:#8882;cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #3c78d2}.buttons{display:flex;gap:6px;margin-top:10px}.buttons button{flex:1}input[type=range]{width:100%;margin:12px 0 2px;accent-color:#3c78d2}#message{padding:8px;border-radius:8px;margin-top:8px;background:#dc961e29}#message:empty{display:none}.head{display:flex;align-items:center;justify-content:flex-end;margin-top:10px}.head strong{font-size:16px}
@media(max-width:600px){main{padding:56px 3px 3px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.card{padding:8px;min-width:0}.icon{font-size:20px}.value{font-size:14px}.section{padding:9px}.row{font-size:12px}button{font-size:12px;padding:7px}.label{font-size:10px}}
.motionTrack{position:relative;height:18px;background:#8882;border-radius:4px;overflow:hidden;margin:6px 0}.motionBar{position:absolute;top:0;height:100%;background:#00b99d;min-width:2px}.motionItem{margin:12px 0}.motionLog{max-height:180px;overflow:auto}.motionScale{display:flex;justify-content:space-between;font-size:10px;opacity:.65}dialog{color:inherit;background:Canvas;border:1px solid #8885;border-radius:12px;padding:18px;width:min(340px,90%)}dialog::backdrop{background:#0006}dialog p{line-height:1.4}.confirm-open{background:#d23c3c25}dialog h2{margin:0;font-size:17px}
.doorHistory{margin-top:10px;padding-top:5px;border-top:1px solid #8883;font-size:11px}.doorHistory .row{padding:3px 0;border:0}.doorHistory .row span:last-child{max-width:70%;font-variant-numeric:tabular-nums}

.dashboard{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:start}.dashboard>.overview-status{grid-column:span 3}.dashboard>.overview-door{grid-column:span 3}.dashboard>#card-battery,.dashboard>#card-pv{grid-column:span 1}.dashboard>#card-light,.dashboard>#card-cinema{grid-column:span 2}.overview-group{padding:12px;border:1px solid #8883;border-radius:12px;background:#8881;min-width:0}.overview-group h2{margin:0 0 10px;font-size:12px;font-weight:600}.overview-status .group-content{display:grid;grid-template-columns:1fr 1fr;gap:12px}.overview-group .card{border:0;padding:0;background:none}.overview-status .icon{display:none}.overview-status .value{font-size:17px}.overview-status .card.on .value{color:#258145}.overview-status #card-alarm.on .value{color:#bf3828}.overview-door .group-content{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}.overview-door #card-lock{display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center}.overview-door #card-lock .icon{grid-row:span 2;font-size:19px;margin:0}.overview-door #card-lock .value{font-size:17px}.overview-door #card-permission .icon{display:none}.overview-door #card-permission .value{font-size:13px;font-weight:500}.overview-door .buttons{margin-top:6px}.overview-door #card-permission>button{width:100%;margin-top:6px!important}.dashboard>.card{min-width:0}.dashboard>#card-light,.dashboard>#card-cinema{padding:12px}.dashboard .icon{font-size:19px;margin-bottom:3px}.dashboard .buttons{margin-top:7px}.dashboard .cinemaFields{margin-top:7px}.dashboard .cinemaFields label{font-size:12px;margin:6px 0 3px}.dashboard input[type=range]{margin:8px 0 0}.dashboard>#card-battery .value,.dashboard>#card-pv .value{font-size:15px}.dashboard select{padding:6px;font-size:12px}.dashboard #card-pv .small{line-height:1.3}
@media(max-width:850px){.dashboard{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.dashboard>.overview-status{grid-column:span 2}.dashboard>#card-battery,.dashboard>#card-pv{grid-column:span 1}.dashboard>.overview-door{grid-column:span 2}.dashboard>#card-light,.dashboard>#card-cinema{grid-column:span 1}.overview-door .group-content{grid-template-columns:1fr 1fr;gap:10px}.dashboard>.card,.overview-group,.dashboard>#card-light,.dashboard>#card-cinema{padding:9px}.overview-group h2{margin-bottom:7px}.dashboard .value{font-size:14px}.dashboard button{min-height:36px;font-size:12px;padding:6px 8px}.overview-door #card-permission .label{font-size:9px}.overview-door #card-lock .value{font-size:15px}}
@media(max-width:340px){.dashboard>#card-light,.dashboard>#card-cinema{grid-column:span 2}.overview-door .group-content{grid-template-columns:1fr}}
</style></head><body><main>

<div class="grid" id="cards"></div>
<div id="message" role="status" aria-live="polite"></div>
<section class="section" id="motionSection"><h2>Bewegung &ndash; letzte 24 Stunden</h2><div id="motion"></div></section>
<section class="section" id="roomsSection"><h2>R&auml;ume</h2><div id="rooms"></div></section>
<section class="section" id="weatherSection"><h2>Wetter</h2><div id="weather"></div></section>
<div class="head"><button id="refresh" type="button" aria-label="Werte aktualisieren" title="Hausstatus 0.7">&#8635;</button></div>
</main>
<dialog id="doorDialog" aria-labelledby="doorQuestion"><h2 id="doorQuestion">Haust&uuml;r wirklich &ouml;ffnen?</h2><p>Die Falle wird entriegelt. Eine Person vor der T&uuml;r kann eintreten.</p><div class="buttons"><button id="doorCancel" type="button">Abbrechen</button><button id="doorYes" class="confirm-open" type="button">Ja, T&uuml;r &ouml;ffnen</button></div></dialog>
<script>
let state=/*INITIAL_STATE*/null;
let doorRequest=null,doorToken=null,doorExpiryTimer=null;
let busy=false, pendingTimer=null, timeoutTimer=null, editing=false, messageTimer=null;
const el=id=>document.getElementById(id);
function text(node,value){node.textContent=String(value??'Unbekannt');}
function showStatus(value,temporary=false){
 clearTimeout(messageTimer);messageTimer=null;text(el('message'),value);
 if(temporary)messageTimer=setTimeout(()=>{text(el('message'),'');messageTimer=null;},3000);
}
function card(key,icon,label,value,kind=''){
 const box=document.createElement('div');box.className='card '+kind;box.id='card-'+key;
 for(const [cls,val] of [['icon',icon],['label',label],['value',value]]){const d=document.createElement('div');d.className=cls;text(d,val);box.append(d);}
 el('cards').append(box);return box;
}
function buttons(box,command,enabled){
 const row=document.createElement('div');row.className='buttons';
 for(const [caption,value] of [['Ein',true],['Aus',false]]){
  const b=document.createElement('button');b.type='button';text(b,caption);b.disabled=!enabled||busy;
  b.addEventListener('click',()=>send(command,value));row.append(b);
 }
 box.append(row);
}
function rows(target,list){const root=typeof target==='string'?el(target):target;root.replaceChildren();for(const [name,value] of list){const row=document.createElement('div');row.className='row';for(const v of [name,value]){const span=document.createElement('span');text(span,v);row.append(span);}root.append(row);}}
function doorHistory(s){const box=document.createElement('div');box.className='doorHistory';rows(box,[['Letzte \u00d6ffnung',s.DoorOpened.text],['Letzte Schlie\u00dfung',s.DoorClosed.text]]);return box;}
function boolValue(entry,on='An',off='Aus'){return entry?.raw===null?'Unbekannt':entry?.raw===true?on:entry?.raw===false?off:'Unbekannt';}
function kind(entry){return entry?.raw===true?'on':'';}
function render(){
 if(!state)return;
 el('cards').replaceChildren();
 const s=state;
 card('presence','\u{1f3e0}','Anwesenheit',boolValue(s.Presence,'Zu Hause','Abwesend'),kind(s.Presence));
 const doorOpen=s.DoorContact.raw===1||s.DoorContact.raw===true;
 const lock=s.Lock.raw;
 const lockCard=card('lock',doorOpen?'\u{1f6aa}':lock===1?'\u{1f512}':'\u{1f513}','Haust\u00fcr',doorOpen?'T\u00fcr offen':lock===1?'Verriegelt':lock===2?'Aufgeschlossen':'Unbekannt',doorOpen?'danger':lock===1?'on':lock===2?'warn':'');
 if(s.View===2)lockCard.append(doorHistory(s));
 const permission=card('permission','\u{1f510}','T\u00fcr \u00f6ffnen',boolValue(s.DoorPermission,'Freigegeben','Gesperrt'),s.DoorPermission.raw===true?'danger':s.DoorPermission.raw===false?'on':'');
 const permissionButtons=document.createElement('div');permissionButtons.className='buttons';
 for(const [caption,value] of [['Freigeben',true],['Sperren',false]]){const b=document.createElement('button');b.type='button';text(b,caption);b.disabled=!s.Controls.DoorPermission||busy||s.DoorPermission.raw===value;b.addEventListener('click',()=>{closeDoorDialog();send('DoorPermission',value);});permissionButtons.append(b);}permission.append(permissionButtons);
 const doorButton=document.createElement('button');doorButton.type='button';text(doorButton,'T\u00fcr \u00f6ffnen');doorButton.disabled=!s.Controls.Door||busy;doorButton.style.marginTop='10px';doorButton.addEventListener('click',prepareDoor);permission.append(doorButton);
 if(!s.Controls.Door&&s.DoorReason){const n=document.createElement('div');n.className='small';text(n,s.DoorReason);permission.append(n);}

 card('alarm','\u{1f6e1}','Alarm innen',boolValue(s.Alarm),kind(s.Alarm));
 const warnings=s.BatteryWarnings.raw;
 card('battery','\u{1f50b}','Ger\u00e4te',Number.isInteger(warnings)?warnings>0?`${warnings} Warnung(en)`:'Alles OK':s.BatteryWarnings.raw===null?'Nicht eingerichtet':'Unbekannt',Number.isInteger(warnings)?warnings>0?'danger':'on':'');
 const light=card('light','\u{1f4a1}','Wohnzimmerlicht',boolValue(s.LightState),kind(s.LightState));
 buttons(light,'Light',s.Controls.Light);
 const range=document.createElement('input');range.type='range';range.min='1';range.max='100';range.step='1';range.setAttribute('aria-label','Helligkeit Wohnzimmer');range.value=Number.isInteger(s.Brightness.raw)?Math.max(1,Math.min(100,s.Brightness.raw)):50;range.disabled=!s.Controls.Brightness||busy;
 const level=document.createElement('div');level.className='small';text(level,Number.isInteger(s.Brightness.raw)?`Helligkeit ${s.Brightness.raw} %`:'Helligkeit unbekannt');
 range.addEventListener('pointerdown',()=>{editing=true;});
 range.addEventListener('input',()=>{editing=true;text(level,`Helligkeit ${range.value} %`);});
 range.addEventListener('change',()=>{editing=false;send('Brightness',Number(range.value));});
 range.addEventListener('blur',()=>{if(editing){editing=false;render();}});
 light.append(range,level);
 const cinema=card('cinema','\u{1f50a}','Cinema 40',boolValue(s.CinemaState),s.CinemaState.raw===true?'info':'');buttons(cinema,'Cinema',s.Controls.Cinema);renderCinemaFields(cinema,s);
 const pv=card('pv','\u2600','PV-Anlage',s.PVPower.text,'info');const energy=document.createElement('div');energy.className='small';text(energy,'Heute '+s.PVEnergy.text);pv.append(energy);
 renderMotion(s.Motion);
 rows('rooms',s.Rooms.map(r=>[r.name,r.value]));
 rows('weather',[['Wetter',s.Weather.text],['Wind',s.Wind.text],['Regen',s.Rain.text],['Warnstufe',s.Warning.text],['Sonnenaufgang',s.Sunrise.text],['Sonnenuntergang',s.Sunset.text]]);
 applyView(s.View??0);
}
function applyView(view){
 const keys={1:['presence','alarm'],2:['lock','permission'],4:['battery'],5:['light'],6:['cinema'],7:['pv'],8:[],9:[],10:[]};
 for(const n of el('cards').children)n.hidden=view!==0&&!(keys[view]??[]).includes(n.id.replace('card-',''));
 if(view===0)groupOverview();
 el('cards').hidden=[8,9,10].includes(view);el('cards').className=view===0?'dashboard':view===1||view===2?'grid':'grid single';
 for(const [id,v] of [['motionSection',8],['roomsSection',9],['weatherSection',10]])el(id).hidden=view!==0&&view!==v;
}
function groupOverview(){
 const items=Object.fromEntries(Array.from(el('cards').children).map(n=>[n.id.replace('card-',''),n]));
 const group=(name,title,keys)=>{const box=document.createElement('section');box.className='overview-group '+name;const h=document.createElement('h2');text(h,title);box.append(h);const inside=document.createElement('div');inside.className='group-content';for(const key of keys)inside.append(items[key]);box.append(inside);return box;};
 const status=group('overview-status','Anwesenheit und Alarm',['presence','alarm']);
 const door=group('overview-door','Haust\u00fcr',['lock','permission']);
 door.append(doorHistory(state));
 el('cards').replaceChildren(status,door,items.light,items.cinema,items.battery,items.pv);
}
function renderCinemaFields(box,s){
 const fields=document.createElement('div');fields.className='cinemaFields';
 const sourceLabel=document.createElement('label');text(sourceLabel,'Quelle');fields.append(sourceLabel);
 const source=s.CinemaSource??{raw:null,text:'Nicht eingerichtet'},options=s.CinemaOptions??[];
 if(options.length){
  const select=document.createElement('select');select.setAttribute('aria-label','Cinema 40 Quelle');select.disabled=busy;
  if(!options.some(o=>o.value===source.raw)){const n=document.createElement('option');n.value='';text(n,'Aktuell: '+source.text);select.append(n);}
  for(const o of options){const n=document.createElement('option');n.value=String(o.value);text(n,o.name);select.append(n);}
  select.value=options.some(o=>o.value===source.raw)?String(source.raw):'';
  select.addEventListener('change',()=>{if(select.value!=='')send('CinemaSource',Number(select.value));});fields.append(select);
 }else{const n=document.createElement('div');text(n,source.raw===null?'Nicht eingerichtet':source.text);fields.append(n);}
 const volume=s.CinemaVolume??{raw:null,text:'Nicht eingerichtet'},control=s.VolumeControl;
 const volumeLabel=document.createElement('label');text(volumeLabel,'Lautst\u00e4rke: '+(volume.raw===null?'Nicht eingerichtet':volume.text));fields.append(volumeLabel);
 if(control&&typeof volume.raw==='number'){
  const range=document.createElement('input');range.type='range';range.min=String(control.min);range.max=String(control.max);range.step=String(control.step);range.value=String(volume.raw);range.disabled=busy;range.setAttribute('aria-label','Cinema 40 Lautstaerke');
  range.addEventListener('pointerdown',()=>{editing=true;});range.addEventListener('input',()=>{editing=true;const unit=String(volume.text).replace(/[-+]?\d+(?:[.,]\d+)?/,'').trim();text(volumeLabel,'Lautst\u00e4rke: '+range.value+(unit?' '+unit:''));});
  range.addEventListener('change',()=>{editing=false;send('CinemaVolume',Number(range.value));});
  range.addEventListener('blur',()=>{if(editing){editing=false;render();}});fields.append(range);
 }else if(s.VolumeReason){
  const reason=document.createElement('div');reason.className='small';text(reason,'Regler nicht verf\u00fcgbar: '+s.VolumeReason);fields.append(reason);
 }
 box.append(fields);
}
function motionTime(t){return new Date(t*1000).toLocaleString('de-DE',{timeZone:'Europe/Berlin',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function renderMotion(m){
 el('motion').replaceChildren();if(!m)return;
 for(const sensor of m.sensors){
  const box=document.createElement('div');box.className='motionItem';
  const title=document.createElement('div');text(title,sensor.name+' \u2014 '+(sensor.current===true?'Bewegung erkannt':sensor.current===false?'Keine Bewegung':'Unbekannt'));box.append(title);
  const track=document.createElement('div');track.className='motionTrack';track.setAttribute('aria-label','Bewegungszeiten '+sensor.name);
  const h=sensor.history, entries=h.entries.filter(e=>e.time>=m.start&&e.time<=m.end).slice().sort((a,b)=>a.time-b.time);
  let active=h.previous,begin=m.start;
  const bar=(a,b)=>{if(b<=a)return;const n=document.createElement('div');n.className='motionBar';n.style.left=((a-m.start)/86400*100)+'%';n.style.width=((b-a)/86400*100)+'%';n.title=motionTime(a)+' bis '+motionTime(b);track.append(n);};
  for(const e of entries){if(active===true)bar(begin,e.time);active=e.active;begin=e.time;}if(active===true)bar(begin,m.end);
  box.append(track);const scale=document.createElement('div');scale.className='motionScale';for(const t of [m.start,m.end]){const n=document.createElement('span');text(n,motionTime(t));scale.append(n);}box.append(scale);
  if(h.note){const n=document.createElement('div');n.className='small';text(n,h.note);box.append(n);}
  const detail=document.createElement('details'),summary=document.createElement('summary');text(summary,'Zeitpunkte anzeigen ('+entries.length+' Zustandswechsel)');detail.append(summary);
  const log=document.createElement('div');log.className='motionLog';
  if(!entries.length){const n=document.createElement('div');text(n,'Keine aufgezeichneten Zustandswechsel in diesem Zeitraum.');log.append(n);}
  for(const e of entries.slice().reverse()){const n=document.createElement('div');n.className='row';text(n,motionTime(e.time)+' \u2014 '+(e.active?'Bewegung erkannt':'Keine Bewegung'));log.append(n);}detail.append(log);box.append(detail);el('motion').append(box);
 }
}
function send(command,value){
 if(busy)return;
 if(typeof requestAction!=='function'){showStatus('Die Bedienung ist nur innerhalb der Symcon-Kachel verf\u00fcgbar.');return;}
 busy=true;editing=false;showStatus('Befehl wird gesendet ...');render();
 timeoutTimer=setTimeout(()=>{busy=false;pendingTimer=null;showStatus('Keine Best\u00e4tigung empfangen. Status pr\u00fcfen.');render();},8000);
 try{requestAction(command,value);pendingTimer=setTimeout(()=>requestAction('Refresh',null),1200);}catch(e){finish();showStatus('Befehl konnte nicht gesendet werden.');render();}
}
function finish(){busy=false;clearTimeout(pendingTimer);clearTimeout(timeoutTimer);pendingTimer=null;timeoutTimer=null;}
function handleMessage(data){
 let message;try{message=typeof data==='string'?JSON.parse(data):data;}catch(e){return;}
 if(message?.error){finish();showStatus(message.error);render();return;}
 if(!message?.Controls)return;
 state=message;
 // Background updates are not an acknowledgement of the requested hardware state.
 if(!busy&&!editing)render();
}
function prepareDoor(){
 if(busy)return;
 if(typeof requestAction!=='function'){showStatus('Bedienung nur in Symcon verf\u00fcgbar.');return;}
 doorRequest=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');doorToken=null;
 send('DoorConfirm',{request:doorRequest});
}
function closeDoorDialog(){clearTimeout(doorExpiryTimer);doorToken=null;doorRequest=null;if(el('doorDialog').open)el('doorDialog').close();render();}
el('doorCancel').addEventListener('click',closeDoorDialog);
el('doorDialog').addEventListener('cancel',closeDoorDialog);
el('doorYes').addEventListener('click',()=>{if(!doorToken)return;const value={request:doorRequest,token:doorToken};closeDoorDialog();send('DoorOpen',value);});
el('refresh').addEventListener('click',()=>{if(typeof requestAction==='function')requestAction('Refresh',null);});
// Enable acknowledgement handling separately so background messages cannot unblock a command.
const receiveState=handleMessage;
handleMessage=function(data){
 let message;try{message=typeof data==='string'?JSON.parse(data):data;}catch(e){return;}
 if(message?.doorConfirmation){
  const c=message.doorConfirmation;if(c.request!==doorRequest)return;
  finish();doorToken=c.token;const remaining=(c.ttl??20)*1000;
  if(remaining<=0){closeDoorDialog();showStatus('Bestaetigung abgelaufen.');render();return;}
  showStatus('');el('doorDialog').showModal();el('doorCancel').focus();
  clearTimeout(doorExpiryTimer);doorExpiryTimer=setTimeout(()=>{closeDoorDialog();showStatus('Best\u00e4tigung abgelaufen. Bitte erneut beginnen.');render();},Math.min(remaining,20000));return;
 }
 if(message?.commandDone){finish();showStatus(message.error||'Befehl \u00fcbergeben.',!message.error);if(message.state)state=message.state;render();return;}
 receiveState(data);
};
render();
</script></body></html>
