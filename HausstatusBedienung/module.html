<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;color:inherit;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{padding:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px}.card,.section{padding:12px;border-radius:12px;border:1px solid #8883;background:#8881}.card.on{background:#2da05025}.card.warn{background:#dc961e29}.card.danger{background:#d23c3c29}.card.info{background:#3c78d229}.icon{font-size:23px;margin-bottom:6px}.label{font-size:10px;text-transform:uppercase;opacity:.65}.value{font-size:17px;font-weight:600;margin-top:4px;overflow-wrap:anywhere}.small{font-size:11px;opacity:.65;margin-top:4px}.section{margin-top:10px}.section h2{font-size:14px;margin:0 0 6px}.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #8882}.row span:first-child{opacity:.7}.row span:last-child{text-align:right;overflow-wrap:anywhere;max-width:65%}button{border:1px solid #8885;border-radius:8px;padding:8px 10px;min-height:38px;font:inherit;color:inherit;background:#8882;cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #3c78d2}.buttons{display:flex;gap:6px;margin-top:10px}.buttons button{flex:1}input[type=range]{width:100%;margin:12px 0 2px;accent-color:#3c78d2}#message{padding:8px;border-radius:8px;margin-top:8px;background:#dc961e29}#message:empty{display:none}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.head strong{font-size:16px}
@media(max-width:600px){main{padding:3px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.card{padding:8px;min-width:0}.icon{font-size:20px}.value{font-size:14px}.section{padding:9px}.row{font-size:12px}button{font-size:12px;padding:7px}.label{font-size:10px}}
</style></head><body><main>
<div class="head"><strong>Hausstatus</strong><button id="refresh" type="button" aria-label="Werte aktualisieren">&#8635;</button></div>
<div class="grid" id="cards"></div>
<div id="message" role="status" aria-live="polite"></div>
<section class="section"><h2>R&auml;ume</h2><div id="rooms"></div></section>
<section class="section"><h2>Wetter</h2><div id="weather"></div></section>
<section class="section"><h2>Haust&uuml;r</h2><div id="door"></div></section>
</main><script>
let state=/*INITIAL_STATE*/null;
let busy=false, pendingTimer=null, timeoutTimer=null, editing=false;
const el=id=>document.getElementById(id);
function text(node,value){node.textContent=String(value??'Unbekannt');}
function card(key,icon,label,value,kind=''){
 const box=document.createElement('div');box.className='card '+kind;box.id='card-'+key;
 for(const [cls,val] of [['icon',icon],['label',label],['value',value]]){const d=document.createElement('div');d.className=cls;text(d,val);box.append(d);}
 el('cards').append(box);return box;
}
function buttons(box,command,enabled){
 const row=document.createElement('div');row.className='buttons';
 for(const [caption,value] of [['Ein',true],['Aus',false]]){
  const b=document.createElement('button');b.type='button';text(b,caption);b.disabled=!enabled||busy;
  b.addEventListener('click',()=>send(command,value));row.append(b);
 }
 box.append(row);
}
function rows(target,list){el(target).replaceChildren();for(const [name,value] of list){const row=document.createElement('div');row.className='row';for(const v of [name,value]){const span=document.createElement('span');text(span,v);row.append(span);}el(target).append(row);}}
function boolValue(entry,on='An',off='Aus'){return entry?.raw===null?'Unbekannt':entry?.raw===true?on:entry?.raw===false?off:'Unbekannt';}
function kind(entry){return entry?.raw===true?'on':'';}
function render(){
 if(!state)return;
 el('cards').replaceChildren();
 const s=state;
 card('presence','\u{1f3e0}','Anwesenheit',boolValue(s.Presence,'Zu Hause','Abwesend'),kind(s.Presence));
 const doorOpen=s.DoorContact.raw===1||s.DoorContact.raw===true;
 const lock=s.Lock.raw;
 card('lock',doorOpen?'\u{1f6aa}':lock===1?'\u{1f512}':'\u{1f513}','Haust\u00fcr',doorOpen?'T\u00fcr offen':lock===1?'Verriegelt':lock===2?'Aufgeschlossen':'Unbekannt',doorOpen?'danger':lock===1?'on':lock===2?'warn':'');
 card('permission','\u{1f510}','T\u00fcr \u00f6ffnen',boolValue(s.DoorPermission,'Freigegeben','Gesperrt'),s.DoorPermission.raw===true?'danger':s.DoorPermission.raw===false?'on':'');
 card('alarm','\u{1f6e1}','Alarm innen',boolValue(s.Alarm),kind(s.Alarm));
 const warnings=s.BatteryWarnings.raw;
 card('battery','\u{1f50b}','Ger\u00e4te',Number.isInteger(warnings)?warnings>0?`${warnings} Warnung(en)`:'Alles OK':'Unbekannt',Number.isInteger(warnings)?warnings>0?'danger':'on':'');
 const light=card('light','\u{1f4a1}','Wohnzimmerlicht',boolValue(s.LightState),kind(s.LightState));
 buttons(light,'Light',s.Controls.Light);
 const range=document.createElement('input');range.type='range';range.min='1';range.max='100';range.step='1';range.setAttribute('aria-label','Helligkeit Wohnzimmer');range.value=Number.isInteger(s.Brightness.raw)?Math.max(1,Math.min(100,s.Brightness.raw)):50;range.disabled=!s.Controls.Brightness||busy;
 const level=document.createElement('div');level.className='small';text(level,Number.isInteger(s.Brightness.raw)?`Helligkeit ${s.Brightness.raw} %`:'Helligkeit unbekannt');
 range.addEventListener('pointerdown',()=>{editing=true;});
 range.addEventListener('input',()=>{editing=true;text(level,`Helligkeit ${range.value} %`);});
 range.addEventListener('change',()=>{editing=false;send('Brightness',Number(range.value));});
 range.addEventListener('blur',()=>{if(editing){editing=false;render();}});
 light.append(range,level);
 const cinema=card('cinema','\u{1f50a}','Cinema 40',boolValue(s.CinemaState),s.CinemaState.raw===true?'info':'');buttons(cinema,'Cinema',s.Controls.Cinema);
 const pv=card('pv','\u2600','PV-Anlage',s.PVPower.text,'info');const energy=document.createElement('div');energy.className='small';text(energy,'Heute '+s.PVEnergy.text);pv.append(energy);
 rows('rooms',s.Rooms.map(r=>[r.name,r.value]));
 rows('weather',[['Wetter',s.Weather.text],['Wind',s.Wind.text],['Regen',s.Rain.text],['Warnstufe',s.Warning.text],['Sonnenaufgang',s.Sunrise.text],['Sonnenuntergang',s.Sunset.text]]);
 rows('door',[['Letzte \u00d6ffnung',s.DoorOpened.text],['Letzte Schlie\u00dfung',s.DoorClosed.text]]);
}
function send(command,value){
 if(busy)return;
 if(typeof requestAction!=='function'){text(el('message'),'Die Bedienung ist nur innerhalb der Symcon-Kachel verf\u00fcgbar.');return;}
 busy=true;editing=false;text(el('message'),'Befehl wird gesendet ...');render();
 timeoutTimer=setTimeout(()=>{busy=false;pendingTimer=null;text(el('message'),'Keine Best\u00e4tigung empfangen. Status pr\u00fcfen.');render();},8000);
 try{requestAction(command,value);pendingTimer=setTimeout(()=>requestAction('Refresh',null),1200);}catch(e){finish();text(el('message'),'Befehl konnte nicht gesendet werden.');render();}
}
function finish(){busy=false;clearTimeout(pendingTimer);clearTimeout(timeoutTimer);pendingTimer=null;timeoutTimer=null;}
function handleMessage(data){
 let message;try{message=typeof data==='string'?JSON.parse(data):data;}catch(e){return;}
 if(message?.error){finish();text(el('message'),message.error);render();return;}
 if(!message?.Controls)return;
 state=message;
 // Background updates are not an acknowledgement of the requested hardware state.
 if(!busy&&!editing)render();
}
el('refresh').addEventListener('click',()=>{if(typeof requestAction==='function')requestAction('Refresh',null);});
// Enable acknowledgement handling separately so background messages cannot unblock a command.
const receiveState=handleMessage;
handleMessage=function(data){
 let message;try{message=typeof data==='string'?JSON.parse(data):data;}catch(e){return;}
 if(message?.commandDone){finish();text(el('message'),message.error||'Befehl \u00fcbergeben.');if(message.state)state=message.state;render();return;}
 receiveState(data);
};
render();
</script></body></html>
